<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">个人数字分身架构</title>
  <desc id="d">多个 AI 通过 AGENTS.md 统一入口读写同一份状态与记忆；推荐组合：程序和状态存私有 GitHub 仓，原件存飞书云空间，Google Drive 做副仓和临时收件箱，夸克等网盘兜底备份，隐私和密钥只留本机。</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif; fill: #0F172A; }
    .h1 { font-size: 22px; font-weight: 700; }
    .sub { font-size: 14px; fill: #475569; }
    .col { font-size: 13px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
    .b { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; fill: #475569; }
    .w { fill: #FFFFFF; }
    .line { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="958" height="538" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="40" y="52" class="h1">个人数字分身：一个大脑，多个 AI，随处可用</text>
  <text x="40" y="80" class="sub">规则和状态都是普通文件，任何能读文件的 AI 都按同一份协议干活，换窗口、换设备、换模型都能接着做</text>

  <!-- 左：你用的 AI -->
  <text x="40" y="120" class="col">你用的 AI</text>
  <g>
    <rect x="40" y="132" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="58" y="159" class="b">Claude Code / Codex</text>
    <rect x="40" y="186" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="58" y="213" class="b">Cursor 等编辑器里的 AI</text>
    <rect x="40" y="240" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="58" y="267" class="b">网页版 ChatGPT / Claude</text>
    <rect x="40" y="294" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="58" y="321" class="b">手机上的 AI App</text>
    <rect x="40" y="348" width="210" height="44" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-dasharray="4 3"/>
    <text x="58" y="375" class="b">定时任务（无人值守）</text>
  </g>
  <path d="M250,154 H285 M250,208 H285 M250,262 H285 M250,316 H285 M250,370 H285 M285,154 V370" class="line"/>
  <path d="M285,160 H314" class="line" marker-end="url(#a)"/>

  <!-- 中：协议与状态 -->
  <text x="320" y="120" class="col">统一协议与状态</text>
  <rect x="320" y="132" width="300" height="60" rx="10" fill="#1E40AF"/>
  <text x="338" y="157" class="b w">AGENTS.md 统一入口</text>
  <text x="338" y="179" class="s" style="fill:#DBEAFE">接手 · 记忆路由 · 守则 · 归档 · G0–G6</text>

  <rect x="320" y="206" width="300" height="50" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="338" y="227" class="b">当前状态 + 未闭环事项</text>
  <text x="338" y="246" class="s">current-state.md · open-loops.md</text>
  <rect x="320" y="266" width="300" height="50" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="338" y="287" class="b">长期记忆 + 本地语义召回</text>
  <text x="338" y="306" class="s">memory/ · memory_recall.py（召回后回原文核对）</text>
  <rect x="320" y="326" width="300" height="50" rx="10" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="338" y="347" class="b">逐字对话 + 工作日志 + 变更留痕</text>
  <text x="338" y="366" class="s">chat-exports · work-logs · trace</text>
  <rect x="320" y="388" width="300" height="42" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <text x="338" y="414" class="b" style="font-size:13px">安全阀：只推私有仓 · 查密钥 · 冲突不覆盖</text>

  <!-- 右：存在哪 -->
  <text x="690" y="120" class="col">存在哪（推荐组合，都可替换）</text>
  <rect x="690" y="132" width="230" height="50" rx="10" fill="#ECFDF5" stroke="#34D399"/>
  <text x="706" y="153" class="b">私有 GitHub 仓</text>
  <text x="706" y="172" class="s">程序 · 状态 · 记忆 · 对话文字</text>
  <rect x="690" y="188" width="230" height="50" rx="10" fill="#EFF6FF" stroke="#60A5FA"/>
  <text x="706" y="209" class="b">飞书云空间 · 主资料库</text>
  <text x="706" y="228" class="s">文档 · 表格 · PDF · 音视频原件</text>
  <rect x="690" y="244" width="230" height="50" rx="10" fill="#F5F3FF" stroke="#A78BFA"/>
  <text x="706" y="265" class="b">Google Drive · 副仓/临时</text>
  <text x="706" y="284" class="s">给连不上飞书的网页版 AI 收件</text>
  <rect x="690" y="300" width="230" height="50" rx="10" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="706" y="321" class="b">夸克等网盘 · 兜底（可选）</text>
  <text x="706" y="340" class="s">客户端自动备份整个项目文件夹</text>
  <rect x="690" y="356" width="230" height="50" rx="10" fill="#F1F5F9" stroke="#94A3B8"/>
  <text x="706" y="377" class="b">只留本机</text>
  <text x="706" y="396" class="s">隐私 · 密钥 · 全量会话 · 索引</text>
  <path d="M620,231 C652,231 652,157 684,157" class="line" marker-end="url(#a)" marker-start="url(#a)"/>
  <path d="M620,291 C652,291 652,381 684,381" class="line" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <!-- 底部说明 -->
  <rect x="40" y="456" width="880" height="52" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="60" y="478" class="b" style="font-size:13px">公开仓只有程序，不含任何个人数据。</text>
  <text x="60" y="497" class="s">你 clone 之后用自己的私有仓、自己的飞书 / 云盘账号；用哪几层、哪家服务、什么路径，都在 .personal/agent.json 里自己定。</text>
</svg>
