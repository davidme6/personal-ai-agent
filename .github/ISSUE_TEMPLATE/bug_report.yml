name: Bug report
description: Report a reproducible problem using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never paste personal records, credentials, or payment information.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and Python version, without usernames or absolute private paths.
    validations:
      required: true
